name: CI

on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  julia-format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
      - uses: julia-actions/cache@v3
      - name: Install JuliaFormatter and format
        run: julia scripts/format.jl "check"

  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.version == '1.14' }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1.11'
          - '1.12'
          - '1.13'
          - '1.14'
        os:
          - ubuntu-latest
        arch:
          - x64
    needs: [julia-format]
    env:
      # julia-buildpkg exported this; without it Pkg uses the package server's lagging
      # registry snapshot, so a just-registered dependency version may not resolve.
      JULIA_PKG_SERVER_REGISTRY_PREFERENCE: eager
    steps:
      - uses: actions/checkout@v6
      - run: |
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip' # caching pip dependencies
      - run: |
          pip install -r requirements.txt
          export PYTHON=$(which python3)
      - uses: julia-actions/install-juliaup@v3
        with:
          channel: ${{ matrix.version }}~${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      # Runs test items in parallel worker processes, each in a Pkg.test-style sandbox
      # built from [extras]/[targets], so no julia-buildpkg step is needed.
      - uses: julia-actions/julia-run-testitems@v2
        with:
          juliaup-channel: ${{ matrix.version }}~${{ matrix.arch }}
          # Well above the slowest item; a timeout attaches a backtrace dump to the item
          testitem-timeout: 1200
          # juliati collects coverage only on Julia 1.11+
          coverage-lcov-path: ${{ matrix.version != '1.10' && 'lcov.info' || '' }}
      - uses: codecov/codecov-action@v6
        if: matrix.version != '1.10'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
