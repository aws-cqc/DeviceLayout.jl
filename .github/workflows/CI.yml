name: CI

on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  julia-format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
      - uses: julia-actions/cache@v3
      - name: Install JuliaFormatter and format
        run: julia scripts/format.jl "check"

  test:
    name: Julia ${{ matrix.version }} - shard ${{ matrix.shard }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.version == 'pre' }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Pull requests test the oldest supported version and the latest release;
        # pushes, tags and manual runs test every version
        version: ${{ github.event_name == 'pull_request' && fromJSON('["1.10", "1.13"]') || fromJSON('["1.10", "1.11", "1.12", "1.13", "pre"]') }}
        # Each version's suite is split across jobs by test file (see test/shards.jl).
        # The denominator is the shard count, so change all entries together.
        shard: ['1/3', '2/3', '3/3']
        os:
          - ubuntu-latest
        arch:
          - x64
    needs: [julia-format]
    steps:
      - uses: actions/checkout@v6
      - run: |
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip' # caching pip dependencies
      - run: |
          pip install -r requirements.txt
          export PYTHON=$(which python3)
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
        with:
          # The shards of one version share a single cache entry, rather than
          # multiplying the repository's cache use (10 GB limit) by the shard count
          cache-name: julia-cache;workflow=${{ github.workflow }};job=${{ github.job }};version=${{ matrix.version }};os=${{ matrix.os }};arch=${{ matrix.arch }}
          include-matrix: false
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          DL_TEST_SHARD: ${{ matrix.shard }}
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src
      - uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
