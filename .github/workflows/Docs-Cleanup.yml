name: Documentation Preview Cleanup

on:
  pull_request:
    types: [closed]

jobs:
  cleanup-preview-docs:
    runs-on: ubuntu-latest
    # Every job that pushes to gh-pages shares this group, so they push one at a time;
    # queue: max keeps every waiting job instead of replacing it with the newest.
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gh-pages

      - name: Delete preview and history
        env:
          PRNUM: ${{ github.event.number }}
        run: |
          if [[ -d previews/PR$PRNUM ]]; then
            git config user.name "Documenter.jl"
            git config user.email "documenter@juliadocs.github.io"
            git rm -rf previews/PR$PRNUM
            git commit -m "delete preview"
            git branch gh-pages-new $(echo "delete history" | git commit-tree HEAD^{tree})
            git push --force origin gh-pages-new:gh-pages
          fi
